name: validate

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

permissions:
  contents: write

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commits:
    name: Conventional Commits
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go run ./cmd/xtask commit-check --range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

  validate:
    name: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Cache golangci-lint binary
        id: cache-golangci
        uses: actions/cache@v4
        with:
          path: ~/go/bin/golangci-lint
          key: golangci-lint-${{ runner.os }}-${{ runner.arch }}-v2.15.0
      - name: Install pinned golangci-lint
        if: steps.cache-golangci.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/go/bin"
          curl -sSfL https://golangci-lint.run/install.sh | sh -s -- -b "$HOME/go/bin" v2.15.0
          "$HOME/go/bin/golangci-lint" --version
      - name: Run native Go validation suite
        run: |
          export PATH="$HOME/go/bin:$PATH"
          go run ./cmd/xtask validate

  release:
    name: Tag & Release
    needs: [validate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Read module version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$VERSION" = "0.0.0" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release artifacts and notes
        if: steps.version.outputs.skip != 'true'
        run: |
          mkdir -p dist
          go build -o dist/xtask ./cmd/xtask
          cp ThirdPartyNotices.txt dist/
          (cd dist && shasum -a 256 xtask ThirdPartyNotices.txt > SHA256SUMS)

      - name: Tag and push
        if: steps.version.outputs.skip != 'true'
        run: |
          # CHANGE ME: customize release bot identity if desired
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          if ! git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            git tag "v${{ steps.version.outputs.version }}"
            git push origin "v${{ steps.version.outputs.version }}"
          fi

      - name: Publish GitHub Release
        if: steps.version.outputs.skip != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: dist/*

      - name: Sync dev branch with main
        run: git push origin HEAD:refs/heads/dev --force
